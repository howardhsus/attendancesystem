<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'; frame-src 'none'; object-src 'none';">
    <title>台北101智能服務通報系統</title>
    <link rel="stylesheet" href="static/css/main.css?v=202611">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <button type="button" class="logo" id="reloadLogo" aria-label="重新開始通報">
                <div class="logo-icon">
                    <img src="static/pic/logo.png" alt="Taipei 101 Logo">
                </div>
            </button>
            <button type="button" class="report-label" id="langSwitchBtn">
                English
            </button>
        </header>

        <main class="chat-container" id="chatContainer" aria-live="polite"></main>

        <footer class="input-area-padding"></footer>
    </div>

    <!-- 獨立雙入口：分別對應「直接開啟後鏡頭拍照」與「相簿選圖」，徹底相容 Android Photo Picker 與 iOS Safari -->
    <input type="file" id="cameraFileInput" class="hidden-file-input" accept="image/*" capture="environment">
    <input type="file" id="galleryFileInput" class="hidden-file-input" accept="image/*">

    <!-- 照片預覽模態框 -->
    <div class="modal" id="imageModal" role="dialog" aria-modal="true" aria-labelledby="imageModalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="imageModalTitle">📷 照片預覽</div>
                <button type="button" class="modal-close" id="closeImageModalBtn" aria-label="關閉">×</button>
            </div>
            <div class="modal-body modal-body-center">
                <img id="modalImage" alt="預覽照片">
            </div>
        </div>
    </div>

    <!-- 樓層選擇模態框 -->
    <div class="modal" id="floorModal" role="dialog" aria-modal="true" aria-labelledby="floorModalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="floorModalTitle">選擇樓層</div>
                <button type="button" class="modal-close" id="closeFloorModalBtn" aria-label="關閉">×</button>
            </div>
            <div class="modal-body">
                <div class="floor-options" id="floorOptions"></div>
            </div>
        </div>
    </div>

    <!-- 地點選擇模態框 -->
    <div class="modal" id="locationModal" role="dialog" aria-modal="true" aria-labelledby="locationModalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="locationModalTitle">選擇地點</div>
                <button type="button" class="modal-close" id="closeLocationModalBtn" aria-label="關閉">×</button>
            </div>
            <div class="modal-body">
                <div class="location-options" id="locationOptions"></div>
            </div>
        </div>
    </div>

    <script src="static/js/main.js?v=202611" defer></script>
</body>
</html>
